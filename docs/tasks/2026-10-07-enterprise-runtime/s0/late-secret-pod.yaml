# Throwaway: the pod is created before its Secret exists (the controller would write the Secret,
# carrying the node's boot ID, only after the pod is scheduled). How long does kubelet take to start it?
apiVersion: v1
kind: Pod
metadata: {name: late-secret, namespace: kete-s0}
spec:
  runtimeClassName: kata-qemu
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: c
    image: ghcr.io/kete-org/kete-job@sha256:7c0c31d68d17cf8cd9d1ecbe9186b102ee6571c931bc072bd19b7739cf4a676a
    command: ["/bin/sh", "-c", "cat /run/late/node_boot_id; echo; cat /proc/sys/kernel/random/boot_id; cat /proc/sys/net/ipv4/ip_unprivileged_port_start"]
    volumeMounts: [{name: s, mountPath: /run/late, readOnly: true}]
  volumes: [{name: s, secret: {secretName: late-secret}}]
