# Throwaway: what is left of a job Secret after the container unmounts its volume (and after the
# Secret object is deleted), inside the Kata guest and on the node.
apiVersion: v1
kind: Secret
metadata: {name: s0-secret, namespace: kete-s0}
stringData: {config.json: '{"marker":"S0-SECRET-MARKER"}'}
---
apiVersion: v1
kind: Pod
metadata: {name: secret-kata, namespace: kete-s0}
spec:
  runtimeClassName: kata-qemu
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: c
    image: ghcr.io/kete-org/kete-job@sha256:7c0c31d68d17cf8cd9d1ecbe9186b102ee6571c931bc072bd19b7739cf4a676a
    command: ["/bin/sh", "-c", "grep secret-mnt /proc/self/mountinfo; umount /run/secret-mnt && echo umount-ok; ls -A /run/secret-mnt | wc -l; mkdir -p /mnt/vfs; if mount -t virtiofs kataShared /mnt/vfs; then echo virtiofs-remount-ok; grep -rl S0-SECRET-MARKER /mnt/vfs 2>/dev/null | head; umount /mnt/vfs; else echo virtiofs-remount-failed; fi; grep -rl S0-SECRET-MARKER /run /tmp /var 2>/dev/null | head -3; echo as-tool-user:; setpriv --reuid=65534 --regid=65534 --clear-groups sh -c 'mount -t virtiofs kataShared /mnt/vfs 2>&1 | head -1'; sleep 120"]
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [SYS_ADMIN, SETUID, SETGID, DAC_OVERRIDE]}}
    volumeMounts: [{name: s, mountPath: /run/secret-mnt, readOnly: true}]
  volumes: [{name: s, secret: {secretName: s0-secret, defaultMode: 0400}}]
