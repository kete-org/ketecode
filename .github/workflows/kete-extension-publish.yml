# Kete-owned. Publishes a released stable version of the VS Code extension to the VS Code
# Marketplace and Open VSX. See docs/release.md ("Publish the extension").
#
# Extension publishing is the final go-live step, so it never happens as a side effect of a release
# tag: a maintainer dispatches this workflow ON the release tag (the registries environment only
# accepts kete-v* tags) and types the tag again to confirm:
#
#   gh workflow run kete-extension-publish.yml --repo kete-org/ketecode --ref kete-v0.2.0 -f confirm=kete-v0.2.0
#
# It publishes the .vsix files already attached to that tag's published GitHub Release (built and
# checked by kete-release.yml), after verifying them against the release's SHA256SUMS; it builds
# nothing. Stable versions only: the Marketplace accepts no pre-release suffix. Re-running is safe:
# both registries skip versions they already have (--skip-duplicate).
name: kete-extension-publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "The tag you are running this on (kete-vX.Y.Z), to confirm publishing its extension to the VS Code Marketplace and Open VSX"
        required: true

concurrency:
  group: kete-extension-publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Entra ID app's IDs (variables) and OVSX_PAT live here; the environment admits kete-v* tags
    # only, and the app's federated credential trusts this environment only.
    environment: registries
    permissions:
      contents: read
      # GitHub's OIDC token, exchanged with Microsoft Entra ID for the Marketplace publish.
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" == refs/tags/kete-v* ]] || { echo "::error::Run this workflow on a release tag (--ref kete-vX.Y.Z), not $REF"; exit 1; }
          [ "$CONFIRM" = "$TAG" ] || { echo "::error::confirm ($CONFIRM) doesn't match the tag ($TAG)"; exit 1; }
          [[ "${TAG#kete-v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$TAG is a pre-release: the VS Code Marketplace accepts only X.Y.Z versions"; exit 1; }

      # Before the download: checkout cleans the workspace.
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download the released extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')" \
            || { echo "::error::$TAG has no GitHub Release; run kete-release first"; exit 1; }
          [ "$state" = "false false" ] || { echo "::error::$TAG's release is a draft or a pre-release ($state)"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --pattern SHA256SUMS --dir release

      - name: Verify the packages
        run: |
          set -euo pipefail
          version="${TAG#kete-v}"
          (cd release && sha256sum -c --ignore-missing SHA256SUMS)
          packages=(release/*.vsix)
          [ "${#packages[@]}" -eq 8 ] || { echo "::error::expected 8 .vsix files, found ${#packages[@]}"; exit 1; }
          for vsix in "${packages[@]}"; do
            grep -q "  $(basename "$vsix")$" release/SHA256SUMS || { echo "::error::$vsix is not in SHA256SUMS"; exit 1; }
            packaged="$(unzip -p "$vsix" extension/package.json | jq -r .version)"
            [ "$packaged" = "$version" ] || { echo "::error::$vsix has version $packaged, expected $version"; exit 1; }
          done

      # The VS Code Marketplace: Microsoft Entra ID instead of a personal access token. azure/login
      # exchanges this job's GitHub OIDC token for the app's identity (no stored secret); vsce's
      # --azure-credential then uses that Azure CLI session. --skip-duplicate makes a re-run finish a
      # partial publish instead of failing.
      - name: Check the Entra ID settings
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          [ -n "$AZURE_CLIENT_ID" ] || { echo "::error::The registries environment has no AZURE_CLIENT_ID variable (docs/release.md)"; exit 1; }
          [ -n "$AZURE_TENANT_ID" ] || { echo "::error::The registries environment has no AZURE_TENANT_ID variable (docs/release.md)"; exit 1; }

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the VS Code Marketplace
        run: |
          set -euo pipefail
          bunx --bun @vscode/vsce@4.0.0 publish --azure-credential --skip-duplicate --allow-missing-repository --packagePath release/*.vsix \
            || { echo "::error::Publishing to the VS Code Marketplace failed"; exit 1; }

      # ovsx reads OVSX_PAT from the environment: the token never appears on a command line.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          [ -n "$OVSX_PAT" ] || { echo "::error::OVSX_PAT is not set in the registries environment"; exit 1; }
          for vsix in release/*.vsix; do
            bunx --bun ovsx@1.2.0 publish "$vsix" --skip-duplicate \
              || { echo "::error::Publishing $vsix to Open VSX failed"; exit 1; }
          done
