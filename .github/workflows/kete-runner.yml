# Kete-owned. The enterprise Kubernetes runner (packages/kete-runner-chart + the `kubernetes` mode
# of packages/kete-job-host + the entrypoint's kubevm profile; enterprise runtime pieces P1 and P2).
# Path-filtered to protect the shared CI minutes budget (see kete-build.yml). Two ubuntu-latest jobs:
#   chart  helm lint, helm template + kubeconform (Kubernetes 1.30 and 1.32), values refusals, the
#          chart's rendered configuration parsed by the controller's own parser, and the
#          controller's Go tests built with the test-only pod drivers (-tags kete_testdriver; the
#          module's other tests run in kete-job-host.yml). ~2 min.
#   e2e    a two-node kind cluster with a local registry.
#          ci/e2e.sh (P1): the chart against the job-host fake (TLS, its CA as the chart's CA
#          bundle, through a CONNECT proxy), enrollment, poll, placeholder machines started and
#          stopped, exit, repository_unknown, orphan kill across a restart, the deadline kill, RBAC
#          and the admission policy refusing shared-kernel pods.
#          ci/e2e-kubevm.sh (P2): a second release with the kubevm pod driver running the job image
#          (entrypoint built with -tags kete_testdriver, the CI-only `kete-test` RuntimeClass on
#          runc) against the jobs-v1 fake: a real job (claim → the scripted model through `kete job
#          run` → bundle, audit and proxy log in the outbox → finish {"outbox":true}), and the
#          refusals (wrong repository, shared kernel, RuntimeClasses, image pull). ~30 min with the
#          kete and image builds. Kata itself can't run on GitHub's runners (no nested KVM in kind).
name: kete-runner

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/kete-runner-chart/**"
      - "packages/kete-job-host/**"
      - "packages/kete-job-entrypoint/**"
      - "packages/kete-egress/**"
      - "packages/kete-job-image/**"
      - ".github/workflows/kete-runner.yml"
  push:
    branches: [main]
    paths:
      - "packages/kete-runner-chart/**"
      - "packages/kete-job-host/**"
      - "packages/kete-job-entrypoint/**"
      - "packages/kete-egress/**"
      - "packages/kete-job-image/**"
      - ".github/workflows/kete-runner.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every tool and image is pinned (versions verified by Go's checksum database, images by digest).
env:
  KIND_VERSION: v0.27.0
  KIND_NODE_IMAGE: kindest/node:v1.32.2@sha256:142f543559cc55d64e1ab9341df08e5ced84bd2e893736da8f51320f26f5950b
  KUBECONFORM_VERSION: v0.6.7
  HELM_VERSION: v3.17.3
  REGISTRY_IMAGE: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
  BUSYBOX_A: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
  BUSYBOX_B: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kete-job-host/go.mod
          cache-dependency-path: packages/kete-job-host/go.sum

      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform (Go module, checksum-verified)
        run: go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"

      - name: helm lint and kubeconform
        working-directory: packages/kete-runner-chart
        run: |
          helm version
          helm lint . --strict -f ci/lint-values.yaml
          for v in 1.30.0 1.32.0; do
            helm template kete-runner . -n kete-system -f ci/lint-values.yaml \
              | "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version "$v"
          done

      - name: Values the chart must refuse
        working-directory: packages/kete-runner-chart
        run: |
          refuse() {
            if helm template kete-runner . -n kete-system -f ci/lint-values.yaml "$@" >/dev/null 2>&1; then
              echo "accepted: $*"; exit 1
            fi
          }
          refuse --set image.digest=latest
          refuse --set-json 'jobs.runtimeClassNames=["runc"]'
          refuse --set-json 'jobs.images=["registry.corp.example/kete/job:latest"]'
          refuse --set jobs.slots=129
          refuse --set boundary.summary=everything
          refuse --set platform.url=http://portal.kete.example
          refuse --set jobs.namespace=kete-system
          refuse --set-json 'networkPolicy.apiServer.cidrs=[]'
          refuse --set proxy.url=http://user:pw@proxy.corp.example:3128
          refuse --set admissionPolicy.enabled=false
          refuse --set-json 'jobs.egress.cidrs=["0.0.0.0/0"]'
          refuse --set-json 'jobs.egress.cidrs=["::/0"]'
          refuse --set-json 'jobs.egress.cidrs=["169.254.169.254/32"]'
          refuse --set-json 'jobs.egress.cidrs=["10.0.0.0/4"]'
          refuse --set "controller.serviceAccountName=a'b"
          refuse --set "image.repository=a'b"
          refuse --set-json 'networkPolicy.platform.cidrs=["not-a-cidr"]'
          refuse --set caBundle.existingSecret=A_B
          refuse --set-json 'repositorySources=[]'
          refuse --set podDriver=other
          refuse --set-json 'repositorySources=[{"name":"gitlab:payments/api","url":"http://gitlab.corp.example/x.git","cloneSecret":"s"}]'
          refuse --set-json 'repositorySources=[{"name":"gitlab:payments/api","url":"https://u:p@gitlab.corp.example/x.git","cloneSecret":"s"}]'
          refuse --set-json 'repositorySources=[{"name":"gitlab:payments/api","url":"https://gitlab.corp.example/x.git","cloneSecret":"s"},{"name":"gitlab:other/x","url":"https://gitlab.corp.example/y.git","cloneSecret":"s"}]'
          refuse --set proxy.url=
          refuse --set jobs.resources.memory=lots
          refuse --set jobs.outbox.holdHours=0

      - name: The chart's configuration parses (the controller's own parser)
        run: |
          helm template kete-runner packages/kete-runner-chart -n kete-system -f packages/kete-runner-chart/ci/lint-values.yaml \
            --show-only templates/configmap.yaml | sed -n 's/^  config.json: //p' \
            | python3 -c 'import json, sys; sys.stdout.write(json.loads(sys.stdin.read()))' > "$RUNNER_TEMP/rendered.json"
          cd packages/kete-job-host
          KETE_RUNNER_RENDERED_CONFIG="$RUNNER_TEMP/rendered.json" go test ./internal/config/... -run TestChartRenderedConfig -v

      - name: Controller tests (placeholder pod driver build)
        working-directory: packages/kete-job-host
        run: |
          go vet -tags kete_testdriver ./...
          go test -race -tags kete_testdriver ./internal/kube/... ./internal/runner/... ./internal/driver/kubernetes/...
          # The release build refuses the placeholder driver.
          go test -race ./internal/runner/...
          # The config package's file tests need root (kete-job-host.yml runs them); these don't.
          go test -race ./internal/config/... -run 'Kubernetes|KubeVM|Chart' 

  e2e:
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kete-job-host/go.mod
          cache-dependency-path: packages/kete-job-host/go.sum

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build the Linux x64 kete
        working-directory: packages/cli
        run: bun run build --target=kete-linux-x64 --skip-web-ui

      - name: Build the job image (entrypoint with -tags kete_testdriver; never published)
        run: |
          bash packages/kete-job-image/scripts/build.sh --arch amd64 --tag kete-job:kind --go-tags kete_testdriver
          # The jobs-v1 fake runs from the same image (git http-backend, the fake binary).
          printf 'FROM kete-job:kind\nCOPY bin/kete-job-fake-platform /usr/local/libexec/kete-e2e/\n' \
            | docker build -q -t kete-job-fake:kind -f - packages/kete-job-image/.build/ctx-amd64

      - name: Build the test binaries
        working-directory: packages/kete-job-host
        run: |
          CGO_ENABLED=0 go build -trimpath -tags kete_testdriver -o ../kete-runner-chart/ci/kete-job-host ./cmd/kete-job-host
          CGO_ENABLED=0 go build -trimpath -o ../kete-runner-chart/ci/kete-fake-platform ./internal/fakeplatform/cmd/kete-fake-platform

      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kind (Go module, checksum-verified)
        run: go install "sigs.k8s.io/kind@${KIND_VERSION}"

      - name: Local registry and kind cluster
        run: |
          docker run -d --restart=always -p 127.0.0.1:5001:5000 --name kind-registry "$REGISTRY_IMAGE"
          "$(go env GOPATH)/bin/kind" create cluster --image "$KIND_NODE_IMAGE" --config packages/kete-runner-chart/ci/kind.yaml --wait 180s
          for node in $("$(go env GOPATH)/bin/kind" get nodes); do
            docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5001
            printf '[host."http://kind-registry:5000"]\n' | docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5001/hosts.toml
          done
          docker network connect kind kind-registry
          kubectl version
          kubectl get nodes -o wide

      - name: Images by digest
        run: |
          digest() { docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$1" | grep '^localhost:5001/' | head -1; }
          docker build -t localhost:5001/kete-runner:e2e packages/kete-runner-chart/ci
          docker push -q localhost:5001/kete-runner:e2e
          for v in "a=$BUSYBOX_A" "b=$BUSYBOX_B"; do
            docker pull -q "${v#*=}"
            docker tag "${v#*=}" "localhost:5001/busybox-${v%%=*}:e2e"
            docker push -q "localhost:5001/busybox-${v%%=*}:e2e"
          done
          docker tag kete-job:kind localhost:5001/kete-job:kind
          docker push -q localhost:5001/kete-job:kind
          {
            echo "RUNNER_IMAGE=$(digest localhost:5001/kete-runner:e2e)"
            echo "IMAGE_A=$(digest localhost:5001/busybox-a:e2e)"
            echo "IMAGE_B=$(digest localhost:5001/busybox-b:e2e)"
            echo "JOB_IMAGE=$(digest localhost:5001/kete-job:kind)"
            echo "MISSING_IMAGE=localhost:5001/kete-job@sha256:$(head -c 32 /dev/urandom | sha256sum | cut -c1-64)"
            echo "FAKE_IMAGE=kete-job-fake:kind"
          } | tee -a "$GITHUB_ENV"
          # The job image is large: pull it onto the job worker once, before the e2e times its steps.
          docker exec kind-worker crictl pull "$(digest localhost:5001/kete-job:kind)" >/dev/null

      - name: e2e (P1, placeholder pod driver)
        run: packages/kete-runner-chart/ci/e2e.sh

      - name: e2e (P2, kubevm pod driver, a real job pod)
        env:
          E2E_STATE: ${{ runner.temp }}/kete-kubevm-state
        run: packages/kete-runner-chart/ci/e2e-kubevm.sh

      # The state holds the fakes' test credentials (tokens.json, runtime-job.json, ca): never uploaded.
      - name: Remove the test credentials from the state
        if: failure()
        run: sudo find "$RUNNER_TEMP/kete-kubevm-state" \( -name tokens.json -o -name runtime-job.json -o -name 'ca*' -o -name 'jh-ca.pem' -o -name 'values*.yaml' \) -exec rm -rf {} + 2>/dev/null || true

      - name: Upload the e2e state
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kete-runner-kubevm-state
          path: ${{ runner.temp }}/kete-kubevm-state/
          retention-days: 7
          if-no-files-found: ignore
