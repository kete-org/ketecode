# Kete-owned. Publishes a released stable version of the JetBrains plugin to the JetBrains
# Marketplace. See docs/release.md ("Publish the JetBrains plugin").
#
# Like the VS Code extension, publishing is a go-live step that never happens as a side effect of a
# release tag: a maintainer dispatches this workflow ON the release tag (the jetbrains-marketplace
# environment only accepts kete-v* tags) and types the tag again to confirm:
#
#   gh workflow run kete-jetbrains-publish.yml --repo kete-org/ketecode --ref kete-v0.3.0 -f confirm=kete-v0.3.0
#
# It uploads the Marketplace plugin zip (kete-code-jetbrains-<v>.zip) already attached to that tag's
# published GitHub Release (built and checked by kete-release.yml's jetbrains job), after verifying it
# against the release's kete-code-jetbrains-<v>.sha256; it builds nothing. That zip carries no kete
# binary: the plugin downloads its version's kete from kete-releases on first use and verifies it
# against the pinned update keys, which keeps it far below the Marketplace's 400 MB per-file limit
# (still checked here, with the absence of bundled binaries). Stable versions only. The plugin must already exist on the Marketplace (the first upload is made by hand, under the
# vendor account). Re-running is safe: a version the Marketplace already has is reported and skipped.
name: kete-jetbrains-publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "The tag you are running this on (kete-vX.Y.Z), to confirm publishing its JetBrains plugin to the JetBrains Marketplace"
        required: true

concurrency:
  group: kete-jetbrains-publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # JETBRAINS_MARKETPLACE_TOKEN lives here; the environment admits kete-v* tags only.
    environment: jetbrains-marketplace
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Only for the release check's script (packages/kete-jetbrains/script); nothing is built.
      - name: Checkout the tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check the tag
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" == refs/tags/kete-v* ]] || { echo "::error::Run this workflow on a release tag (--ref kete-vX.Y.Z), not $REF"; exit 1; }
          [ "$CONFIRM" = "$TAG" ] || { echo "::error::confirm ($CONFIRM) doesn't match the tag ($TAG)"; exit 1; }
          [[ "${TAG#kete-v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$TAG is a pre-release: only stable X.Y.Z versions go to the JetBrains Marketplace"; exit 1; }

      - name: Download the released plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#kete-v}"
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')" \
            || { echo "::error::$TAG has no GitHub Release; run kete-release first"; exit 1; }
          [ "$state" = "false false" ] || { echo "::error::$TAG's release is a draft or a pre-release ($state)"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "kete-code-jetbrains-$version*" --dir release
          ls -la release
          test -f "release/kete-code-jetbrains-$version.zip" || { echo "::error::$TAG's release has no Marketplace plugin zip (kete-code-jetbrains-$version.zip)"; exit 1; }

      # The per-zip .sha256 comes from the same GitHub Release as the zip, so it guards only against a
      # corrupted download, not a tampered release: the release's signed SHA256SUMS (Ed25519, on the
      # public kete-releases) lists the CLI archives, not the plugin zips. See docs/release.md.
      - name: Verify the plugin
        run: |
          set -euo pipefail
          version="${TAG#kete-v}"
          zip="release/kete-code-jetbrains-$version.zip"
          (cd release && sha256sum -c --ignore-missing "kete-code-jetbrains-$version.sha256")
          grep -q "  kete-code-jetbrains-$version.zip$" "release/kete-code-jetbrains-$version.sha256" \
            || { echo "::error::$zip is not in kete-code-jetbrains-$version.sha256"; exit 1; }
          size="$(stat -c %s "$zip")"
          [ "$size" -le 400000000 ] || { echo "::error::$zip is $((size / 1000000)) MB, over the Marketplace's 400 MB limit"; exit 1; }
          listing="$(unzip -Z1 "$zip")"
          if grep -q '^kete-jetbrains/bin/' <<<"$listing"; then echo "::error::$zip bundles binaries (bin/); the Marketplace zip must not"; exit 1; fi
          jar="$(unzip -Z1 "$zip" | grep -E '^kete-jetbrains/lib/kete-jetbrains-.*\.jar$' | head -1)"
          unzip -p "$zip" "$jar" > plugin.jar
          xml="$(unzip -p plugin.jar META-INF/plugin.xml)"
          grep -q '<id>ai.ketecode.kete-code</id>' <<<"$xml" || { echo "::error::$zip has the wrong plugin id"; exit 1; }
          grep -q "<version>$version</version>" <<<"$xml" || { echo "::error::$zip is not version $version"; exit 1; }

      # The Marketplace zip downloads its kete from the tag's public release on first use, so that
      # release must exist and verify exactly as the plugin will verify it: SHA256SUMS.sig against the
      # update keys inside this plugin zip, and every archive the plugin picks against the signed
      # SHA256SUMS (packages/kete-jetbrains/script/verify-public-release.ts, release-verify.ts's checks).
      - name: Verify the public release the plugin downloads from
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#kete-v}"
          gh release view "$TAG" --repo kete-org/kete-releases --json tagName >/dev/null \
            || { echo "::error::kete-org/kete-releases has no $TAG release: the plugin couldn't download its kete. Publish the CLI first (public distribution)."; exit 1; }
          patterns=(--pattern SHA256SUMS --pattern SHA256SUMS.sig)
          for target in darwin-arm64 darwin-x64-baseline linux-x64-baseline linux-arm64 windows-x64-baseline windows-arm64; do
            case "$target" in linux-*) patterns+=(--pattern "kete-$version-$target.tar.gz") ;; *) patterns+=(--pattern "kete-$version-$target.zip") ;; esac
          done
          gh release download "$TAG" --repo kete-org/kete-releases --dir public "${patterns[@]}"
          ls -la public
          unzip -p plugin.jar ai/ketecode/jetbrains/update-keys.json > plugin-update-keys.json
          bun packages/kete-jetbrains/script/verify-public-release.ts "$version" public plugin-update-keys.json

      # The Marketplace upload API (https://plugins.jetbrains.com/docs/marketplace/plugin-upload.html).
      # The token goes to curl on stdin, never on a command line.
      - name: Publish to the JetBrains Marketplace
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$JETBRAINS_MARKETPLACE_TOKEN" ] || { echo "::error::JETBRAINS_MARKETPLACE_TOKEN is not set in the jetbrains-marketplace environment"; exit 1; }
          version="${TAG#kete-v}"
          status="$(printf 'header = "Authorization: Bearer %s"\n' "$JETBRAINS_MARKETPLACE_TOKEN" | curl --config - \
            -sS --max-time 900 --retry 2 -o response.txt -w '%{http_code}' \
            -F xmlId=ai.ketecode.kete-code -F "file=@release/kete-code-jetbrains-$version.zip" \
            https://plugins.jetbrains.com/plugin/uploadPlugin)" || { echo "::error::The upload request failed"; exit 1; }
          if [ "$status" = 200 ]; then
            echo "::notice::Published Kete Code $version to the JetBrains Marketplace (it appears after JetBrains' review)."
          elif grep -qi "already" response.txt; then
            echo "::notice::The JetBrains Marketplace already has Kete Code $version; nothing to do."
          else
            echo "::error::The JetBrains Marketplace refused the upload (HTTP $status): $(head -c 500 response.txt)"
            exit 1
          fi
