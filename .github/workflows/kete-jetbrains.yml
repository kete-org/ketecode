# Kete-owned. Builds, tests and verifies the JetBrains plugin (packages/kete-jetbrains). There is no
# JDK on the maintainers' machines, so this workflow is the plugin's compiler. See
# packages/kete-jetbrains/README.md.
#
# - build:  validates the committed Gradle wrapper, then `./gradlew buildPlugin test` (unit tests of
#           the pure Kotlin pieces) and the web UI's IDE-host tests (packages/app/src/kete)
# - verify: the JetBrains Plugin Verifier, one IDE per job (each download is ~1-3 GB). Pull requests
#           check only the oldest supported build (IC, sinceBuild 243), to stay within the free
#           minutes; pushes to main and manual runs check all six (adding recent IntelliJ IDEA
#           Community, IntelliJ IDEA, PyCharm, WebStorm and GoLand)
#
# Path-filtered: only plugin changes and the web UI's IDE bridge files run it. No secrets.
name: kete-jetbrains

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/kete-jetbrains/**"
      - "packages/app/src/kete/ide-host*.ts"
      - "packages/app/src/kete/vscode-host.tsx"
      - "packages/app/src/kete/vscode-messages*.ts"
      - "packages/app/src/kete/vscode-theme*.ts"
      - "packages/kete-vscode/src/chat.ts"
      - ".github/workflows/kete-jetbrains.yml"
  push:
    branches: [main]
    paths:
      - "packages/kete-jetbrains/**"
      - "packages/app/src/kete/ide-host*.ts"
      - "packages/app/src/kete/vscode-host.tsx"
      - "packages/app/src/kete/vscode-messages*.ts"
      - "packages/app/src/kete/vscode-theme*.ts"
      - "packages/kete-vscode/src/chat.ts"
      - ".github/workflows/kete-jetbrains.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The committed gradle-wrapper.jar must be an official Gradle release's.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and the IntelliJ Platform artifacts; pull requests only read the cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test the plugin
        working-directory: packages/kete-jetbrains
        run: ./gradlew buildPlugin test

      - name: Check the plugin zip
        working-directory: packages/kete-jetbrains
        run: |
          set -euo pipefail
          zip=(build/distributions/*.zip)
          [ "${#zip[@]}" -eq 1 ] || { echo "::error::expected one plugin zip"; ls build/distributions; exit 1; }
          unzip -l "${zip[0]}"
          jar="$(unzip -Z1 "${zip[0]}" | grep -E '^kete-jetbrains/lib/kete-jetbrains-.*\.jar$' | head -1)"
          [ -n "$jar" ] || { echo "::error::the plugin jar is missing"; exit 1; }
          unzip -p "${zip[0]}" "$jar" > plugin.jar
          unzip -p plugin.jar META-INF/plugin.xml | grep -q '<id>ai.ketecode.kete-code</id>' || { echo "::error::wrong plugin id"; exit 1; }
          unzip -p plugin.jar META-INF/plugin.xml | grep -q 'since-build="243"' || { echo "::error::sinceBuild is not 243"; exit 1; }
          unzip -l plugin.jar META-INF/pluginIcon.svg >/dev/null

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Web UI IDE-host tests
        working-directory: packages/app
        run: bun test --conditions=solid --preload ./happydom.ts ./src/kete

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # <product code>:<version>. IC 2024.3 is the oldest supported (sinceBuild 243); IC 2025.2 is
        # the last IntelliJ IDEA Community with Linux builds; the rest are the current releases. Pull
        # requests run only the first; pushes to main and workflow_dispatch run all six.
        ide: ${{ fromJSON(github.event_name == 'pull_request' && '["IC:2024.3.7"]' || '["IC:2024.3.7", "IC:2025.2.6", "IU:2026.2.3", "PY:2026.2.3", "WS:2026.2.3", "GO:2026.2.3"]') }}
    steps:
      # An IDE download plus its extracted copy outgrow the runner's free disk with the preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Plugin Verifier (${{ matrix.ide }})
        working-directory: packages/kete-jetbrains
        env:
          IDE: ${{ matrix.ide }}
        run: ./gradlew verifyPlugin -PverifyIde="$IDE"
