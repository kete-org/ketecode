# Kete-owned. Checks the cloudvm provider-image template (packages/kete-job-image/packer, kete-code-
# platform ADR 0023 rule 18) on pull requests: the kernel configurations against their fragments,
# shell syntax of the disk scripts, `packer fmt -check`, and `packer validate` of every provider
# build for both architectures with placeholder values (no credential exists here; nothing is
# built or imported). The images themselves are built only from a release (kete-cloudvm-images.yml).
# Path-filtered, protecting the shared CI minutes budget (see kete-build.yml); ~2 minutes.
name: kete-cloudvm-packer

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/kete-job-image/packer/**"
      - "packages/kete-job-host/kernel/**"
      - ".github/workflows/kete-cloudvm-packer.yml"
      - ".github/workflows/kete-cloudvm-images.yml"
  push:
    branches: [main]
    paths:
      - "packages/kete-job-image/packer/**"
      - "packages/kete-job-host/kernel/**"
      - ".github/workflows/kete-cloudvm-packer.yml"
      - ".github/workflows/kete-cloudvm-images.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PACKER_VERSION: 1.16.1
  PACKER_SHA256: af38a9e93e4ed1b9ca68206ae969c64c300c82a3dde46a780dfa629f0867f651

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check the kernel configurations (microvm and cloudvm)
        run: packages/kete-job-host/kernel/check-config.sh

      - name: Shell syntax
        run: |
          set -euo pipefail
          for f in packages/kete-job-image/packer/scripts/*.sh packages/kete-job-image/packer/test/*.sh packages/kete-job-host/kernel/*.sh; do
            bash -n "$f"
          done

      - name: Install Packer
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/packer.zip" \
            "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
          echo "$PACKER_SHA256  $RUNNER_TEMP/packer.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/packer.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: packer fmt, init, validate
        working-directory: packages/kete-job-image/packer
        env:
          # Placeholders: validate requires the providers' settings, never uses them.
          HCLOUD_TOKEN: validate-only
          DIGITALOCEAN_TOKEN: validate-only
          DIGITALOCEAN_SPACES_ACCESS_KEY: validate-only
          DIGITALOCEAN_SPACES_SECRET_KEY: validate-only
        run: |
          set -euo pipefail
          packer version
          packer fmt -check -diff .
          packer init .
          # The hetzner build's file provisioner needs its source to exist.
          mkdir -p output && : > output/disk.raw.xz
          digest="sha256:$(printf 'a%.0s' $(seq 64))"
          for arch in amd64 arm64; do
            packer validate -var arch="$arch" -var job_image="ghcr.io/kete-org/kete-job@$digest" \
              -var disk_dir=/nonexistent -var gcp_project=validate -var gcp_bucket=validate \
              -var do_spaces_bucket=validate -var 'do_regions=["lon1"]' .
          done
          # A job image that isn't pinned by digest is refused.
          if packer validate -var job_image=ghcr.io/kete-org/kete-job:latest -var disk_dir=/nonexistent . >/dev/null 2>&1; then
            echo "::error::an undigested job_image passed validation"; exit 1
          fi
