# Kete-owned. Builds the Kete Code desktop app (packages/desktop, docs/desktop.md) for macOS and
# Windows, unsigned, from this commit's CLI. Runs only when the desktop, its web UI or the code they
# share changes, or by hand. Nothing is published: the packaged apps are uploaded as workflow
# artifacts for testing (macOS: Kete Code Dev.app in a tarball; Windows: the unpacked app folder).
name: kete-desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/desktop/**"
      - "packages/app/**"
      - "packages/gui-plugins/**"
      - "packages/client/src/service*.ts"
      - "packages/util/src/kete/brand.ts"
      - "packages/util/src/kete/desktop.ts"
      - ".github/workflows/kete-desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cli-target` is the CLI build the desktop bundles (desktop/script/utils.ts CLI_BINARIES `directory`).
          - os: macos-latest
            target: darwin-arm64
            cli-target: darwin-arm64
          # The x64 desktop bundles the baseline CLI (cli-windows-x64-baseline), as releases do.
          - os: windows-latest
            target: windows-x64
            cli-target: windows-x64-baseline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OPENCODE_CHANNEL: dev
      OPENCODE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Desktop tests
        run: bun run --cwd packages/desktop test

      # The app bundles this commit's `kete`, not a published one (packages/desktop/script/build.ts).
      # The CLI build takes OPENCODE_TARGET as an explicit target, so it must name the bundled one: with
      # windows-x64 it built cli-windows-x64, the desktop found no cli-windows-x64-baseline and fell back
      # to downloading the published CLI.
      - name: Build CLI
        shell: bash
        env:
          OPENCODE_TARGET: ${{ matrix.cli-target }}
        run: bun run --cwd packages/cli build --skip-install --skip-web-ui

      # Without it the desktop build downloads the published CLI instead of failing.
      - name: Check the bundled CLI was built
        shell: bash
        run: test -x "packages/cli/dist/cli-${{ matrix.cli-target }}/bin/kete" || test -f "packages/cli/dist/cli-${{ matrix.cli-target }}/bin/kete.exe"

      - name: Build desktop app
        run: bun run --cwd packages/desktop build

      # Unsigned: no signing identity or certificate is available to pull requests.
      - name: Package desktop app
        run: bun run --cwd packages/desktop pack

      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kete-desktop-${{ matrix.target }}
          path: dist/desktop/
          retention-days: 7
          if-no-files-found: error

      # After the upload, so a failing build can still be downloaded. Launches the packaged app (not the
      # dev build) with an isolated state dir, checks its runtime's handshake, kills the runtime and
      # waits for the app to restart it (docs/desktop.md).
      - name: Smoke packaged app
        timeout-minutes: 10 # above the script's own waits (180 + 120 + 60 s plus cleanup)
        run: bun run --cwd packages/desktop script/kete-packaged-smoke.ts

      # Manual runs only: drives the packaged app's window against a fake model (docs/desktop.md).
      - name: E2E packaged app
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        env:
          KETE_E2E_RESULTS: ${{ runner.temp }}/kete-e2e
        run: bun run --cwd packages/desktop e2e/kete/electron.ts

      - name: Upload E2E results
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kete-e2e-${{ matrix.target }}
          path: ${{ runner.temp }}/kete-e2e
          retention-days: 7
          if-no-files-found: ignore
