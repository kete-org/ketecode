title = "Kete Code gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Known fake fixtures, doc examples and false positives"
regexes = [
  '''I18nPluralKey$''',
  '''^go\.faq\.''',
  '''^alt\+shift\+''',
  '''0123456789abcdef''',
  '''^9f8e7d6c5b4a$''',
  '''^a1c3e5f7092b4d6f''',
  '''^4f9c2a7e1b8d3f6a''',
  '''ROLECHECK0+''',
  '''^sk-ant-abcdefgh''',
  '''^sk-1234567890''',
  '''^gwkey-0123456789$''',
  '''^abcdef123456$''',
  '''^AIzaSyFAKE''',
  '''MIIBogIBAAJ\.\.\.''',
]

[[allowlists]]
description = "Generated job-host-v1 contract test vectors (docs/platform/job-host-v1.md, shared with kete-code-platform; not real keys)"
regexes = [
  '''^kete_jhe_6VYcQvAovMFvzajh-0vmcx7RWhVSTIIG3X0p3qtdzHk$''',
  '''^aqvKk_cQiwy0qZqDflMnLRaTOhufBkHzqORXp6BveqU$''',
  '''^9sT08dK32cQC5495pwlgLlwyRS1Im9elh8UkfgJxpnE$''',
]

[[allowlists]]
description = "Upstream OpenCode test fixtures, byte-identical to OpenCode's public repository (a publishable Stripe test key, a recorded test JWT, a fake Google key)"
paths = [
  '''^packages/ai/test/fixtures/recordings/''',
  '''^packages/console/app/package\.json$''',
  '''^packages/http-recorder/test/''',
]
