# The plugin version; release builds pass -PpluginVersion=<X.Y.Z> from the kete-vX.Y.Z tag.
pluginVersion=0.0.0
# The IDE the plugin compiles against: the oldest supported (sinceBuild 243), so APIs added later
# can't be used by accident. Newer IDEs are checked by the Plugin Verifier (kete-jetbrains.yml).
platformVersion=2024.3.7
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
