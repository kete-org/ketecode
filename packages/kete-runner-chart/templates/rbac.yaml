# Least privilege (spec §4.3, "S0 findings" 2). No pods/exec, no cluster-wide Secrets, no
# workloads. Cluster scope: `get nodes` (the node boot ID and addresses for the kubevm checks),
# `get` on the configured RuntimeClasses by name (runtime_class_missing) and on this release's
# admission policies and bindings by name (the controller's fail-closed guard).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kete-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
rules:
  # Host keys and state: only these two Secrets may be read or written.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.controller.keysSecret | quote }}, {{ .Values.controller.stateSecret | quote }}]
    verbs: [get, update]
  # Creating them the first time (create can't be limited by name).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  {{- with .Values.enrollment.tokenSecret }}
  # The enrollment token: read once, deleted once spent.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ . | quote }}]
    verbs: [get, delete]
  {{- end }}
  {{- $clone := list }}
  {{- range .Values.repositorySources }}{{ with .cloneSecret }}{{ $clone = append $clone . }}{{ end }}{{ with .minterSecret }}{{ $clone = append $clone . }}{{ end }}{{ end }}
  {{- with ($clone | uniq) }}
  # The repositories' static read credentials (copied into each job's per-job Secret) and the
  # Maintainer tokens that mint per-job clone tokens: read only. Never a writer (jobs namespace).
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ range $i, $n := . }}{{ if $i }}, {{ end }}{{ $n | quote }}{{ end }}]
    verbs: [get]
  {{- end }}
  # Single active replica.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ .Values.controller.leaseName | quote }}]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kete-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kete-runner
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccountName | quote }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kete-runner
  namespace: {{ .Values.jobs.namespace | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
rules:
  # Job and publisher pods (one each per machine) and the per-machine Secrets. No exec, attach or
  # port-forward.
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  # The job's stdout: phase lines only (the entrypoint writes nothing else there).
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Each job's outbox volume, kept after the pod until published or expired.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, delete]
  # Per-machine Secrets: written and deleted, never read back (no `get`: the enterprise's
  # publisher Secrets in this namespace stay unreadable to the controller).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  # Kubernetes Events on job pods (kubectl describe shows the controller's actions).
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kete-runner
  namespace: {{ .Values.jobs.namespace | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kete-runner
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccountName | quote }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "kete-runner-%s-nodes" .Release.Namespace }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  # The admission-policy guard: starts stay blocked unless the jobs namespace's policies exist.
  {{- $names := include "kete-runner.policyNames" . | fromJson }}
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    resourceNames: [{{ $names.pods | quote }}, {{ $names.jobSecrets | quote }}, {{ $names.outboxes | quote }}, {{ $names.controllerSecrets | quote }}, {{ $names.publisherSecrets | quote }}]
    verbs: [get]
  {{- with .Values.jobs.outbox.storageClass }}
  # The outbox StorageClass's provisioner and mount options (checked before any start).
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    resourceNames: [{{ . | quote }}]
    verbs: [get]
  {{- end }}
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    resourceNames: [{{ range $i, $n := .Values.jobs.runtimeClassNames }}{{ if $i }}, {{ end }}{{ $n | quote }}{{ end }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "kete-runner-%s-nodes" .Release.Namespace }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "kete-runner-%s-nodes" .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccountName | quote }}
    namespace: {{ .Release.Namespace }}
