apiVersion: apps/v1
kind: Deployment
metadata:
  name: kete-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  # One replica; the Lease keeps a second (an upgrade's overlap) from polling with the same key.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kete-runner.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kete-runner.selector" . | nindent 8 }}
        kete.dev/role: controller
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccountName | quote }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Pod Security `restricted`.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "kete-runner.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args: [kubernetes, --config, /etc/kete-runner/config.json]
          env:
            - name: KETE_RUNNER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            # subPath: a regular root-owned file (the runner refuses symlinked configuration).
            - name: config
              mountPath: /etc/kete-runner/config.json
              subPath: config.json
              readOnly: true
            {{- if .Values.caBundle.existingSecret }}
            - name: ca
              mountPath: /etc/kete-runner/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: kete-runner-config
        {{- if .Values.caBundle.existingSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.caBundle.existingSecret | quote }}
            items:
              - key: {{ .Values.caBundle.key | quote }}
                path: {{ .Values.caBundle.key | quote }}
        {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
