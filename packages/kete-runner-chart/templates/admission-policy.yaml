{{- /*
The jobs namespace runs at Pod Security `privileged` (job pods add capabilities inside their own
VM), so these policies are its only guard and are always installed (there is no switch): the
controller also refuses to start machines unless they exist with failurePolicy Fail and a Deny
binding (config admission_policies). Kubernetes >= 1.30.
*/ -}}
{{- $sa := include "kete-runner.username" . -}}
{{- $names := include "kete-runner.policyNames" . | fromJson -}}
{{- $classes := .Values.jobs.runtimeClassNames -}}
{{- $images := .Values.jobs.images -}}
{{- $caps := .Values.jobs.allowedCapabilities -}}
{{- $pubSecrets := include "kete-runner.publisherSecrets" . | fromJsonArray -}}
{{- $runnerImage := include "kete-runner.image" . -}}
# Job pods: Pod Security baseline and more (spec §4.2, "S0 findings" 1).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $names.pods | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.jobs.namespace | quote }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers, pods/resize]
  variables:
    - name: runtimeClasses
      expression: {{ toJson $classes | quote }}
    - name: images
      expression: {{ toJson $images | quote }}
    - name: caps
      expression: {{ toJson $caps | quote }}
    - name: seLinuxTypes
      expression: "['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']"
    # Publisher pods (P3): the runner image, `kete-job-host publish`, read-only mounts only.
    - name: isPublish
      expression: "has(object.metadata.labels) && 'kete.dev/role' in object.metadata.labels && object.metadata.labels['kete.dev/role'] == 'publish'"
    - name: runnerImage
      expression: {{ toJson $runnerImage | quote }}
    - name: publisherSecrets
      expression: {{ toJson $pubSecrets | quote }}
  validations:
    - expression: {{ printf "request.userInfo.username == %s" (squote $sa) | quote }}
      message: "only the kete-runner controller creates or changes pods in this namespace"
      reason: Forbidden
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName in variables.runtimeClasses"
      message: "job pods must use an allowed VM-isolated RuntimeClass (shared-kernel pods are not supported)"
      reason: Forbidden
    - expression: "!(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID) && !(has(object.spec.hostIPC) && object.spec.hostIPC)"
      message: "host namespaces are not allowed"
      reason: Forbidden
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "job pods get no service account token"
      reason: Forbidden
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.secret) || has(v.emptyDir) || (has(v.projected) && (!has(v.projected.sources) || v.projected.sources.all(s, has(s.secret) || has(s.configMap) || has(s.downwardAPI)))) || (has(v.persistentVolumeClaim) && has(object.metadata.labels) && 'kete.dev/machine-id' in object.metadata.labels && v.persistentVolumeClaim.claimName == 'kete-outbox-' + object.metadata.labels['kete.dev/machine-id']) || (variables.isPublish && has(v.configMap) && v.configMap.name == 'kete-publisher'))"
      message: "only secret, emptyDir, projected (secret, configMap, downwardAPI) volumes and the machine's own outbox claim are allowed (and the publisher configuration, for publisher pods)"
      reason: Forbidden
    # The writer credentials, the publisher's CA and proxy credential: publisher pods only, never a
    # job pod, never through a projected volume.
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, (!has(v.secret) || variables.isPublish || !(v.secret.secretName in variables.publisherSecrets)) && (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.secret) || !(s.secret.name in variables.publisherSecrets))))"
      message: "only publisher pods mount the GitLab writer and publisher Secrets"
      reason: Forbidden
    - expression: "!variables.isPublish || (size(object.spec.containers) == 1 && object.spec.containers.all(c, c.image == variables.runnerImage && has(c.command) && c.command == ['/usr/local/bin/kete-job-host'] && has(c.args) && size(c.args) > 0 && c.args[0] == 'publish' && !has(c.env) && !has(c.envFrom) && has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem && (!has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0) && (!has(c.volumeMounts) || c.volumeMounts.all(m, has(m.readOnly) && m.readOnly))) && has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot && has(object.spec.volumes) && object.spec.volumes.all(v, (has(v.persistentVolumeClaim) && has(v.persistentVolumeClaim.readOnly) && v.persistentVolumeClaim.readOnly) || (has(v.configMap) && v.configMap.name == 'kete-publisher') || (has(v.secret) && v.secret.secretName in variables.publisherSecrets)))"
      message: "publisher pods run only `kete-job-host publish` from the runner image, non-root, no capabilities, read-only root file system, read-only mounts of their outbox, configuration and Secrets"
      reason: Forbidden
    - expression: "has(object.spec.enableServiceLinks) && object.spec.enableServiceLinks == false"
      message: "job pods must set enableServiceLinks: false"
      reason: Forbidden
    - expression: "(!has(object.spec.initContainers) || size(object.spec.initContainers) == 0) && (!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0)"
      message: "init and ephemeral containers are not allowed"
      reason: Forbidden
    - expression: "!has(object.spec.resourceClaims) || size(object.spec.resourceClaims) == 0"
      message: "resource claims are not allowed"
      reason: Forbidden
    - expression: "variables.isPublish || object.spec.containers.all(c, c.image in variables.images)"
      message: "job pods run only the allowlisted job images, by digest"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)"
      message: "privileged containers are not allowed"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(a, a in variables.caps)))"
      message: "containers drop ALL capabilities and add only the allowed set"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, (!has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)) && (!has(c.volumeDevices) || size(c.volumeDevices) == 0))"
      message: "host ports and volume devices are not allowed"
      reason: Forbidden
    - expression: "(!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile) || object.spec.securityContext.seccompProfile.type != 'Unconfined') && object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type != 'Unconfined')"
      message: "seccomp Unconfined is not allowed"
      reason: Forbidden
    - expression: "(!has(object.spec.securityContext) || !has(object.spec.securityContext.appArmorProfile) || object.spec.securityContext.appArmorProfile.type != 'Unconfined') && object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.appArmorProfile) || c.securityContext.appArmorProfile.type != 'Unconfined') && (!has(object.metadata.annotations) || object.metadata.annotations.all(k, !k.startsWith('container.apparmor.security.beta.kubernetes.io/') || object.metadata.annotations[k] == 'runtime/default' || object.metadata.annotations[k].startsWith('localhost/')))"
      message: "AppArmor Unconfined is not allowed"
      reason: Forbidden
    - expression: "(!has(object.spec.securityContext) || !has(object.spec.securityContext.seLinuxOptions) || ((!has(object.spec.securityContext.seLinuxOptions.type) || object.spec.securityContext.seLinuxOptions.type in variables.seLinuxTypes) && (!has(object.spec.securityContext.seLinuxOptions.user) || object.spec.securityContext.seLinuxOptions.user == '') && (!has(object.spec.securityContext.seLinuxOptions.role) || object.spec.securityContext.seLinuxOptions.role == ''))) && object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.seLinuxOptions) || ((!has(c.securityContext.seLinuxOptions.type) || c.securityContext.seLinuxOptions.type in variables.seLinuxTypes) && (!has(c.securityContext.seLinuxOptions.user) || c.securityContext.seLinuxOptions.user == '') && (!has(c.securityContext.seLinuxOptions.role) || c.securityContext.seLinuxOptions.role == '')))"
      message: "SELinux type, user and role overrides are not allowed"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount) || c.securityContext.procMount == 'Default')"
      message: "procMount Unmasked is not allowed"
      reason: Forbidden
    - expression: "!has(object.spec.securityContext) || !has(object.spec.securityContext.sysctls) || size(object.spec.securityContext.sysctls) == 0"
      message: "pod sysctls are not allowed (the job sets its own inside its VM)"
      reason: Forbidden
    - expression: "(!has(object.spec.securityContext) || !has(object.spec.securityContext.windowsOptions) || !has(object.spec.securityContext.windowsOptions.hostProcess) || !object.spec.securityContext.windowsOptions.hostProcess) && object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.windowsOptions) || !has(c.securityContext.windowsOptions.hostProcess) || !c.securityContext.windowsOptions.hostProcess)"
      message: "Windows host process containers are not allowed"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $names.pods | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  policyName: {{ $names.pods | quote }}
  validationActions: [Deny]
---
# Secrets in the jobs namespace: only the controller writes them, only the per-machine Opaque
# Secrets `kete-job-<machine-id>` (no Secret squatting a machine's name). The named exception (P3):
# the enterprise's publisher Secrets (GitLab writers, the publisher CA and proxy credential), which
# the next policy keeps out of the controller's hands.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $names.jobSecrets | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.jobs.namespace | quote }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: not-a-publisher-secret
      expression: {{ printf "!(request.name in %s)" (toJson $pubSecrets) | quote }}
  validations:
    - expression: {{ printf "request.userInfo.username == %s" (squote $sa) | quote }}
      message: "only the kete-runner controller writes Secrets in the jobs namespace"
      reason: Forbidden
    - expression: "object.metadata.name.startsWith('kete-job-') && has(object.type) && object.type == 'Opaque'"
      message: "only Opaque kete-job-<machine-id> Secrets are allowed in the jobs namespace"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $names.jobSecrets | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  policyName: {{ $names.jobSecrets | quote }}
  validationActions: [Deny]
---
# The publisher Secrets (P3) are the enterprise's: the controller may not create, change or delete
# them (it can't read them either: its Role in the jobs namespace has no `get` on Secrets), so it
# can't swap a writer credential for one it knows.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $names.publisherSecrets | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.jobs.namespace | quote }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: a-publisher-secret
      expression: {{ printf "request.name in %s" (toJson $pubSecrets) | quote }}
  validations:
    - expression: {{ printf "request.userInfo.username != %s" (squote $sa) | quote }}
      message: "the kete-runner controller may not create, change or delete the publisher's Secrets"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $names.publisherSecrets | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  policyName: {{ $names.publisherSecrets | quote }}
  validationActions: [Deny]
---
# Outbox volumes in the jobs namespace: only the controller creates claims, only
# `kete-outbox-<machine-id>` labelled with that machine, ReadWriteOnce, no data source (an outbox
# starts empty: never a clone of another job's volume). CREATE only: the scheduler and the volume
# controller annotate and bind a claim afterwards, and its spec is immutable once created.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $names.outboxes | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.jobs.namespace | quote }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [persistentvolumeclaims]
  variables:
    - name: accessMode
      expression: {{ toJson .Values.jobs.outbox.accessMode | quote }}
    - name: storageClass
      expression: {{ toJson .Values.jobs.outbox.storageClass | quote }}
    - name: maxSize
      expression: {{ toJson (toString .Values.jobs.outbox.maxSize) | quote }}
  validations:
    - expression: {{ printf "request.userInfo.username == %s" (squote $sa) | quote }}
      message: "only the kete-runner controller writes claims in the jobs namespace"
      reason: Forbidden
    - expression: "has(object.metadata.labels) && 'kete.dev/machine-id' in object.metadata.labels && object.metadata.name == 'kete-outbox-' + object.metadata.labels['kete.dev/machine-id'] && object.spec.accessModes == [variables.accessMode] && !has(object.spec.dataSource) && !has(object.spec.dataSourceRef) && !has(object.spec.selector) && !has(object.spec.volumeName)"
      message: "only kete-outbox-<machine-id> claims with the configured access mode and without a data source are allowed in the jobs namespace"
      reason: Forbidden
    - expression: "has(object.spec.storageClassName) && object.spec.storageClassName == variables.storageClass"
      message: "outbox claims use the configured StorageClass (jobs.outbox.storageClass)"
      reason: Forbidden
    - expression: "has(object.spec.resources) && has(object.spec.resources.requests) && 'storage' in object.spec.resources.requests && isQuantity(object.spec.resources.requests['storage']) && quantity(object.spec.resources.requests['storage']).compareTo(quantity(variables.maxSize)) <= 0"
      message: "outbox claims request at most jobs.outbox.maxSize"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $names.outboxes | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  policyName: {{ $names.outboxes | quote }}
  validationActions: [Deny]
---
# The controller's own Secrets in the release namespace: it may create or change only its keys and
# state Secrets, type Opaque (RBAC can't limit `create` by name).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $names.controllerSecrets | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: controller
      expression: {{ printf "request.userInfo.username == %s" (squote $sa) | quote }}
  variables:
    - name: names
      expression: {{ toJson (list .Values.controller.keysSecret .Values.controller.stateSecret) | quote }}
  validations:
    - expression: "object.metadata.name in variables.names && has(object.type) && object.type == 'Opaque'"
      message: "the controller writes only its Opaque keys and state Secrets here"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $names.controllerSecrets | quote }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  policyName: {{ $names.controllerSecrets | quote }}
  validationActions: [Deny]
