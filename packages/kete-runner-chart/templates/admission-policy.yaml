{{- if .Values.admissionPolicy.enabled }}
{{- $classes := required "jobs.runtimeClassNames is required" .Values.jobs.runtimeClassNames -}}
{{- $images := .Values.jobs.images -}}
{{- $caps := .Values.jobs.allowedCapabilities -}}
# Every pod in the jobs namespace (Pod Security `privileged` there) must pass these rules, whoever
# creates it (spec §4.2, "S0 findings" 1). Kubernetes >= 1.30 (ValidatingAdmissionPolicy GA).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ printf "kete-runner-jobs-%s" .Values.jobs.namespace }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.jobs.namespace }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: runtimeClasses
      expression: {{ toJson $classes | quote }}
    - name: images
      expression: {{ toJson $images | quote }}
    - name: caps
      expression: {{ toJson $caps | quote }}
  validations:
    - expression: "request.operation != 'CREATE' || request.userInfo.username == {{ include "kete-runner.username" . | squote }}"
      message: "only the kete-runner controller creates pods in this namespace"
      reason: Forbidden
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName in variables.runtimeClasses"
      message: "job pods must use an allowed VM-isolated RuntimeClass (shared-kernel pods are not supported)"
      reason: Forbidden
    - expression: "!(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID) && !(has(object.spec.hostIPC) && object.spec.hostIPC)"
      message: "host namespaces are not allowed"
      reason: Forbidden
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false && (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.serviceAccountToken))))"
      message: "job pods get no service account token"
      reason: Forbidden
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: "hostPath volumes are not allowed"
      reason: Forbidden
    - expression: "has(object.spec.enableServiceLinks) && object.spec.enableServiceLinks == false"
      message: "job pods must set enableServiceLinks: false"
      reason: Forbidden
    - expression: "(!has(object.spec.initContainers) || size(object.spec.initContainers) == 0) && (!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0)"
      message: "init and ephemeral containers are not allowed"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, c.image in variables.images)"
      message: "job pods run only the allowlisted job images, by digest"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)"
      message: "privileged containers are not allowed"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(a, a in variables.caps)))"
      message: "containers drop ALL capabilities and add only the allowed set"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))"
      message: "host ports are not allowed"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ printf "kete-runner-jobs-%s" .Values.jobs.namespace }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
spec:
  policyName: {{ printf "kete-runner-jobs-%s" .Values.jobs.namespace }}
  validationActions: [Deny]
{{- end }}
