{{- include "kete-runner.checks" . -}}
{{- $k := dict
  "namespace" .Release.Namespace
  "jobs_namespace" .Values.jobs.namespace
  "instance" .Release.Name
  "admission_policies" (values (include "kete-runner.policyNames" . | fromJson) | sortAlpha)
  "keys_secret" .Values.controller.keysSecret
  "state_secret" .Values.controller.stateSecret
  "lease" .Values.controller.leaseName
  "runtime_class_names" .Values.jobs.runtimeClassNames
  "advertise_repositories" .Values.advertiseRepositories
  "boundary" (dict "summary" .Values.boundary.summary "denials" .Values.boundary.denials "publish_refs" .Values.boundary.publishRefs)
  "pod_driver" .Values.podDriver
  "start_timeout_seconds" (int .Values.jobs.startTimeoutSeconds)
-}}
{{- with .Values.enrollment.tokenSecret }}{{ $_ := set $k "enrollment_secret" . }}{{ end -}}
{{- with .Values.proxy.url }}{{ $_ := set $k "proxy" . }}{{ end -}}
{{- if .Values.caBundle.existingSecret }}{{ $_ := set $k "ca_bundle" (printf "/etc/kete-runner/ca/%s" .Values.caBundle.key) }}{{ end -}}
{{- with .Values.repositories }}{{ $_ := set $k "repositories" . }}{{ end -}}
{{- if .Values.placeholder.exitAfter }}{{ $_ := set $k "placeholder" (dict "exit_after" .Values.placeholder.exitAfter) }}{{ end -}}
{{- if .Values.proxy.authSecret.name }}{{ $_ := set $k "proxy_auth_file" (printf "/etc/kete-runner/proxy/%s" .Values.proxy.authSecret.key) }}{{ end -}}
{{- if .Values.jobs.proxy.authSecret.name }}{{ $_ := set $k "job_proxy_auth_file" (printf "/etc/kete-runner/job-proxy/%s" .Values.jobs.proxy.authSecret.key) }}{{ end -}}
{{- if eq .Values.podDriver "kubevm" -}}
{{- $sources := list -}}
{{- range .Values.repositorySources }}{{ $sources = append $sources (dict "name" .name "clone_url" .url "clone_secret" .cloneSecret) }}{{ end -}}
{{- with $sources }}{{ $_ := set $k "repository_sources" . }}{{ end -}}
{{- $internal := list -}}
{{- range .Values.jobs.egress.cidrs }}{{ $internal = append $internal (dict "cidr" . "ports" $.Values.jobs.egress.ports) }}{{ end -}}
{{- $jp := dict "cpu" (toString .Values.jobs.resources.cpu) "memory" (toString .Values.jobs.resources.memory) "ephemeral_storage" (toString .Values.jobs.resources.ephemeralStorage) "outbox_size" (toString .Values.jobs.outbox.size) "outbox_hold_hours" (int .Values.jobs.outbox.holdHours) "outbox_access_mode" .Values.jobs.outbox.accessMode -}}
{{- with .Values.jobs.outbox.storageClass }}{{ $_ := set $jp "outbox_storage_class" . }}{{ end -}}
{{- with $internal }}{{ $_ := set $jp "internal" . }}{{ end -}}
{{- $_ := set $k "job_pod" $jp -}}
{{- end -}}
{{- $cfg := dict
  "platform_url" (trimSuffix "/" .Values.platform.url)
  "driver" "kubernetes"
  "slots" (int .Values.jobs.slots)
  "reset" "none"
  "image_allowlist" .Values.jobs.images
  "kubernetes" $k
-}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kete-runner-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kete-runner.labels" . | nindent 4 }}
data:
  config.json: {{ toJson $cfg | quote }}
