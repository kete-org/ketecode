# Kete Code runner (enterprise private runtime, ADR 0011). Every credential is referenced by the
# name of a Secret you create (or sync with External Secrets / the Secrets Store CSI driver); the
# chart never takes a secret value. See README.md.

platform:
  # The Kete platform origin the runner enrolls with and polls (https, no path). Required.
  url: ""

image:
  # The runner image, pinned by digest (tags are refused). Mirrors are fine
  # (registry.corp/kete/runner@sha256:…).
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

enrollment:
  # Name of a Secret in the release namespace with key `token`: the single-use enrollment token
  # from the portal (kete_jhe_…). The controller reads it once, enrolls, and deletes it. Leave it
  # set after enrollment (the Secret is gone; nothing happens).
  tokenSecret: ""

proxy:
  # The enterprise HTTP proxy (HTTP CONNECT; TLS stays end to end): the controller's platform
  # connection and image verification, and every job's egress (kete-egress chains to it).
  # http(s)://host:port, no credentials. The Kubernetes API is always reached directly. Jobs reach
  # the proxy only if jobs.egress names its address and port.
  url: ""
  # Proxy credentials: a Secret in the release namespace whose key holds `username:password`.
  authSecret:
    name: ""
    key: auth

caBundle:
  # Secret with extra trusted roots (PEM), e.g. a TLS-inspecting proxy's CA: added to the system
  # roots for the controller's platform connection and image verification, and (with proxy.url)
  # for the jobs' upstream TLS (at most 32 KiB then). Verification is never disabled.
  existingSecret: ""
  key: ca.crt

jobs:
  # Namespace for job pods: Pod Security `privileged` (job pods need capabilities inside their
  # own VM, spec S0 findings) with the admission policy below carrying every rule.
  namespace: kete-jobs
  createNamespace: true
  # VM-isolated RuntimeClasses job pods may use (Kata Containers or a managed equivalent). Never
  # runc or gVisor.
  runtimeClassNames: [kata]
  # Job images the runner accepts, by digest (1-16). The platform names one of them per job.
  images: []
  # Concurrent jobs (1-128).
  slots: 16
  # A job pod still Pending after this long is destroyed.
  startTimeoutSeconds: 600
  # Capabilities a job pod may add (inside its own VM). The S0-measured set.
  allowedCapabilities:
    [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE, SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, NET_BIND_SERVICE]
  # Egress allowed to job pods besides DNS (enterprise proxy, GitLab, model endpoints, registry
  # mirrors): the jobs namespace's NetworkPolicy opens each CIDR on these ports, and each job's
  # in-pod proxy gets the same CIDRs and ports as its internal ranges (egress configuration v2), so
  # private addresses and ports other than 443 work. Name them narrowly and canonically
  # (10.20.0.0/16, not 10.20.0.1/16): prefixes shorter than /8 and the link-local metadata range
  # are refused.
  egress:
    cidrs: []
    ports: [443]
  # Each job pod's container: requests = limits. A VM-isolated RuntimeClass adds its own overhead
  # (spec S0: about 390 MB per Kata QEMU pod; set the RuntimeClass's overhead.podFixed to match),
  # and the Kata guest's memory must be sized so the guest sees this limit (README "Kata").
  resources:
    cpu: "2"
    memory: 4Gi
    ephemeralStorage: 20Gi
  # Each job's outbox (a PVC the job writes its result, audit log, proxy log and bundle into, kept
  # after the job for the publisher, P3), deleted holdHours after the job's deadline.
  # storageClass is required: a class that enforces capacity and whose mountOptions include
  # nosuid, nodev and noexec (the controller checks both, and refuses node-directory provisioners
  # such as local-path). The admission policy caps the claim at maxSize and pins the class.
  outbox:
    storageClass: ""
    size: 1Gi
    maxSize: 10Gi
    accessMode: ReadWriteOncePod   # ReadWriteOnce only for volume plugins without ReadWriteOncePod
    holdHours: 24
  # The jobs' own proxy credential (a Secret in the release namespace, key holding
  # username:password), distinct from proxy.authSecret: every job VM holds it in memory while it
  # runs. None by default (jobs then CONNECT without credentials).
  proxy:
    authSecret:
      name: ""
      key: auth

# Runtime repository names this runner serves (e.g. gitlab:payments/api). A job naming another is
# refused (repository_unknown) before anything starts.
repositories: []
# Where each repository is cloned from (required for every repository with podDriver kubevm): an
# https URL and a Secret in the release namespace with keys `username` and `token` (a read-only
# deploy token; it reaches only the job's root entrypoint). Minted per-job tokens arrive in P3.
#   - {name: "gitlab:payments/api", url: "https://gitlab.corp/payments/api.git", cloneSecret: gitlab-payments-read}
repositorySources: []
# Report the names above to the platform (names only).
advertiseRepositories: false

# What may leave the enterprise (spec §3). The platform can only narrow it.
boundary:
  summary: none      # none | redacted | full
  denials: actions   # count | actions | full
  publishRefs: send  # omit | send

# The pod driver: `kubevm` runs each job in a VM-isolated pod (the released job image's entrypoint,
# profile kubevm). `placeholder` exists only in test builds of the runner image (kind CI); a
# release image refuses it.
podDriver: kubevm
placeholder:
  # [{image: <allowlisted digest ref>, seconds: N}]: placeholder machines of that image exit after N s.
  exitAfter: []

controller:
  serviceAccountName: kete-runner
  # Lease the single active replica holds (never two pollers on one key).
  leaseName: kete-runner
  keysSecret: kete-runner-keys
  stateSecret: kete-runner-state
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

networkPolicy:
  enabled: true
  # The Kubernetes API server's endpoint addresses (kubectl get endpoints kubernetes -n default)
  # and port, for the controller's egress. Required when enabled.
  apiServer:
    cidrs: []
    port: 6443
  # The platform, or the proxy when proxy.url is set: CIDRs and ports.
  platform:
    cidrs: []
    ports: [443]
  dns:
    namespace: kube-system
    podLabels: {k8s-app: kube-dns}
