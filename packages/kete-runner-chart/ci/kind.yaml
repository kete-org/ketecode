# kind cluster for the runner e2e, with the local registry as a mirror (images by digest), and
# the feature gates on that keep fields the admission policy refuses (with a gate off the API server
# drops the field before admission, so the denial couldn't be exercised): dynamic resource
# allocation (resourceClaims), ProcMountType and user namespaces (procMount Unmasked needs
# hostUsers: false).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  DynamicResourceAllocation: true
  ProcMountType: true
  UserNamespacesSupport: true
runtimeConfig:
  "resource.k8s.io/v1beta1": "true"
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
